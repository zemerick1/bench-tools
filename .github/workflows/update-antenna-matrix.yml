# Rebuild tools/antenna-matrix/data/matrix.json from live HPE QuickSpecs PDFs.
# curl_cffi impersonates Chrome TLS (no browser). pypdf extracts the tables.
#
# If main is protected against GITHUB_TOKEN pushes, add a PAT with contents:write
# as a repo secret and set checkout token: ${{ secrets.OPENAPI_DOCS_TOKEN }}.

name: Update antenna matrix

on:
  schedule:
    # Tuesday 09:07 UTC — weekly, off the OUI/OpenAPI jobs.
    - cron: "7 9 * * 2"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/antenna-matrix/update_data.py"
      - "tools/antenna-matrix/requirements.txt"
      - ".github/workflows/update-antenna-matrix.yml"

concurrency:
  group: update-antenna-matrix-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/antenna-matrix/requirements.txt

      - name: Install
        run: pip install -r tools/antenna-matrix/requirements.txt

      - name: Rebuild matrix.json from live QuickSpecs
        run: python tools/antenna-matrix/update_data.py

      - name: Commit matrix.json if pairings changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tools/antenna-matrix/data/matrix.json
          if git diff --staged --quiet; then
            echo "No antenna-matrix changes"
            exit 0
          fi
          git commit -m "Refresh Aruba antenna matrix from HPE QuickSpecs."
          git push origin "HEAD:${GITHUB_REF_NAME}"
