# Refresh the committed IEEE OUI dump used by tools/mac-lookup.
# The script only rewrites oui-data.json when mal / mam / mas change, so a
# weekly run does not commit a date-only bump. Cloudflare deploys whatever
# lands on the branch this job pushes.
#
# If main is protected against GITHUB_TOKEN pushes, add a PAT with contents:write
# as a repo secret and set checkout token: ${{ secrets.OPENAPI_DOCS_TOKEN }}.

name: Update OUI registry

on:
  schedule:
    # Monday 08:41 UTC — weekly, off the hour, after the daily OpenAPI job.
    - cron: "41 8 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/mac-lookup/update_oui.py"
      - ".github/workflows/update-oui.yml"

concurrency:
  group: update-oui-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch IEEE OUI CSVs
        run: python tools/mac-lookup/update_oui.py

      - name: Commit oui-data.json if assignments changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tools/mac-lookup/oui-data.json
          if git diff --staged --quiet; then
            echo "No OUI assignment changes"
            exit 0
          fi
          git commit -m "Refresh IEEE OUI registry."
          git push origin "HEAD:${GITHUB_REF_NAME}"
